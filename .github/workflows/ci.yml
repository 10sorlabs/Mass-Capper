name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/google-storage.js
          node --check src/grok.js
          node --check public/app.js
      - run: npm audit --omit=dev
